<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Mako Browser</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1>Mako Browser</h1>
    <p role="status">Connecting to Mako…</p>
    <p>Agents work in their own tabs. You can keep using the browser.</p>
    <button type="button">Pause browser access</button>
    <p class="detail">Chrome may show a debugging banner while a tab is controlled. Closing that banner releases the tab.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
